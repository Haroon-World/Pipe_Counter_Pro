name: pipe_counter_pro
description: "Cross-Platform Pipe Counter Application with Classical CV and TFLite ML engines."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Image & Computer Vision
  image: ^4.3.0

  # Camera & File Selection
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Export Data
  csv: ^6.0.0
  excel: ^4.0.6

  # Native Sharing & Storage
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5


  # UI icons and utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

