name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        type: string
        default: 'v2.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: "Step 1 - Checkout repository"
        uses: actions/checkout@v4

      - name: "Step 2 - Set up Java 17 (Temurin)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Step 3 - Set up Flutter (stable)"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "Step 4 - Install Android SDK packages (NDK 28 + CMake + build tools)"
        run: |
          echo "Installing Android SDK components..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platform-tools" 2>&1 | tail -5
          echo "NDK 28 installed: $(ls $ANDROID_HOME/ndk/)"
          echo "CMake installed: $(ls $ANDROID_HOME/cmake/)"

      - name: "Step 5 - Install Flutter dependencies"
        run: flutter pub get

      - name: "Step 6 - Run test suite"
        run: flutter test --no-pub

      - name: "Step 7 - Build Release APK"
        run: |
          flutter build apk --release
          echo "=== APK BUILD SUCCESSFUL ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: "Step 8 - Rename and prepare APK"
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PipeCounterPro_Android_v2.0.0.apk
          echo "APK ready: $(ls -lh PipeCounterPro_Android_v2.0.0.apk)"

      - name: "Step 9 - Upload APK as downloadable artifact"
        uses: actions/upload-artifact@v4
        with:
          name: PipeCounterPro_Android_v2.0.0
          path: PipeCounterPro_Android_v2.0.0.apk
          retention-days: 30

      - name: "Step 10 - Attach APK to GitHub Release"
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v2.0.0' }}
          name: "Pipe Counter Pro v2.0.0 — Intelligent Multi-Scale Vision Suite"
          body_path: RELEASE_NOTES.md
          files: PipeCounterPro_Android_v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
